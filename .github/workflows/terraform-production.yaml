name: Terraform Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Aws Configure Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002484164:role/GitHubActions-Terraform-Apply-Role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-prod-plan
          path: terraform/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan 
    environment:
      name: terraform-production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-prod-plan
          path: terraform

      - name: Debug OIDC Claims
        shell: bash
        run: |
          echo "Requesting GitHub OIDC token..."
      
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
      
          OIDC_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')
      
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi
      
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f2)
      
          # Add padding if necessary
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
      
          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)
      
          echo "OIDC issuer:"
          echo "$CLAIMS" | jq -r '.iss'
      
          echo "OIDC audience:"
          echo "$CLAIMS" | jq -r '.aud'
      
          echo "OIDC subject:"
          echo "$CLAIMS" | jq -r '.sub'
      
          echo "Repository:"
          echo "$CLAIMS" | jq -r '.repository'
      
          echo "Repository ID:"
          echo "$CLAIMS" | jq -r '.repository_id'
      
          echo "Repository owner ID:"
          echo "$CLAIMS" | jq -r '.repository_owner_id'
      
          echo "Environment:"
          echo "$CLAIMS" | jq -r '.environment'

      - name: Aws configure Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002484164:role/GitHubActions-Terraform-Apply-Role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply --auto-approve tfplan


