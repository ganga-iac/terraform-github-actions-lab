name: Terraform Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment:
      name: terraform-production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Aws Configure Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002484164:role/GitHubActions-Terraform-Apply-Role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-prod-plan
          path: terraform/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-prod-plan
          path: terraform

      - name: Debug OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
      
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
      
            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('Repository:', payload.repository);
            console.log('Repository ID:', payload.repository_id);
            console.log('Repository owner ID:', payload.repository_owner_id);
            console.log('Environment:', payload.environment);
            - name: Check Aws Identity
              run: aws sts get-caller-identity

      - name: Aws configure Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593002484164:role/GitHubActions-Terraform-Apply-Role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply --auto-approve tfplan


